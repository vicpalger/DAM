<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de registro - Mi web</title>
</head>

<body>

    <form method="GET" action="">
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="50">
        </p>

        <p>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" maxlength="50">
        </p>

        <p>
            <label>Sexo:</label>
            <input type="radio" id="hombre" name="sexo" value="hombre">
            <label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="sexo" value="mujer">
            <label for="mujer">Mujer</label>
        </p>

        <p>
            <label for="correo">Correo electrónico:</label>
            <input type="text" id="correo" name="correo">
        </p>
        <p>
            <label for="opciones">Elige una opción:</label>
            <select id="opciones" name="opciones">
                <option value="España">España</option>
                <option value="Portugal" selected>Portugal</option>
                <option value="Francia">Francia</option>
            </select>
        </p>
        <p>
            <Label>Descripcion:</Label>
            <textarea name="Descripcion" id="" cols="50" rows="4"></textarea>
        </p>
        <p>
            <input type="checkbox" id="informacion" name="informacion" checked>
            <label for="informacion">Deseo recibir información sobre novedades y ofertas</label>
        </p>

        <p>
            <input type="checkbox" id="condiciones" name="condiciones">
            <label for="condiciones">
                Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de
                datos
            </label>
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
<a href="../Into.html"><----</a>
</body>

</html>
