<form>


    <label for="nombre">Nombre:</label>
    <input type="text" name="nombre" id="nombre" maxlength="30">
    <br><br>


    <label for="apellidos">Apellidos:</label>
    <input type="text" name="apellidos" id="apellidos" maxlength="30">
    <br><br>


    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required>
    <br><br>


    <label for="asunto">Asunto:</label>
    <select name="asunto" id="asunto" size="3">
        <option value="presupuesto">Pedir presupuesto</option>
        <option value="cita">Solicitar cita previa</option>
        <option value="otros">Otros</option>
    </select>
    <br><br>
    

    <label>¿Cómo nos ha escogido?</label><br>

    <input type="checkbox" name="como_nos_ha_escogido" value="amigo">
    <label>Un amigo</label><br>

    <input type="checkbox" name="como_nos_ha_escogido" value="googleando">
    <label>Googleando</label><br>

    <input type="checkbox" name="como_nos_ha_escogido" value="buzoneo">
    <label>Buzoneo</label><br>

    <input type="checkbox" name="como_nos_ha_escogido" value="otros">
    <label>Otros</label>

    <br><br>


    <label for="mensaje">Mensaje:</label><br>
    <textarea name="mensaje" id="mensaje" maxlength="300" rows="4"></textarea>

    <br><br>


    <input type="checkbox" name="rgpd" id="rgpd" required>
    <label for="rgpd">Acepto la cláusula RGPD</label>

    <br><br>

    <input type="submit" value="Enviar">

</form>
