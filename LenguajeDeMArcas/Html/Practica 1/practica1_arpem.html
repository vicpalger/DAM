<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de aceptación - ARPEM</title>
</head>

<body>
    <header>
        <h1>Formulario de aceptación de condiciones legales</h1>
        <p>Completa tus datos y acepta las condiciones para enviar el formulario.</p>
        <nav aria-label="Navegación principal">
            <a href="AvisoLegal.html">Aviso legal</a> |
            <a href="Política de privacidad.html">Política de privacidad</a>
        </nav>
    </header>

    <main>
        <form action="https://ningunawebsinpoliticadeprivacidad.com" method="post" enctype="multipart/form-data">
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                <label for="apellidos">Apellidos:</label><br>
                <input type="text" id="apellidos" name="apellidos" required>
            </p>
            <p>
                <label for="dni">DNI (adjuntar copia):</label><br>
                <input type="file" id="dni" name="dni" accept=".pdf,.jpg,.jpeg,.png" required>
            </p>
            <p>
                <label for="telefono">Teléfono:</label><br>
                <input type="tel" id="telefono" name="telefono" required>
            </p>
            <p>
                <input type="checkbox" id="aceptacion" name="aceptacion" value="aceptado" required>
                <label for="aceptacion">He leído el <a href="AvisoLegal.html">aviso legal</a> y acepto la <a href="Política de privacidad.html">política de privacidad</a>.</label>
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
    </main>
</body>

</html>
